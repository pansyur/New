version: 1

# Explicitly tell TurtleCI to watch for pushes to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    builder:
      - macos
    
    steps:
      - uses: checkout
      
      - name: Install Dependencies
        run: |
          pod install --repo-update
          
      - name: Run Tests
        run: |
          xcodebuild test -workspace MyApp.xcworkspace -scheme MyApp -destination 'platform=iOS Simulator,name=iPhone 15'
